services:
  - type: web
    name: fake-news-detector-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: REDDIT_CLIENT_ID
        value: ${REDDIT_CLIENT_ID}
      - key: REDDIT_CLIENT_SECRET
        value: ${REDDIT_CLIENT_SECRET}

  - type: web
    name: fake-news-detector-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_API_URL
        value: https://fake-news-detector-backend.onrender.com
